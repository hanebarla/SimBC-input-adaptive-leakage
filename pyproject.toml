[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robo_manip_baselines"
description = "RoboManipBaselines research fork for SimBC input-adaptive leakage experiments"
readme = "README.md"
authors = [
  {name = "Masaki Murooka", email = "m-murooka@aist.go.jp"},
  {name = "Tomohiro Motoda", email = "tomohiro.motoda@aist.go.jp"},
  {name = "Ryoichi Nakajo", email = "ryoichi-nakajo@aist.go.jp"},
]
maintainers = [
  {name = "Takehiro Habara"},
]
requires-python = ">= 3.10"
dependencies = [
  "ipdb",
  "ipython",
  "gymnasium==1.0.0",
  "mujoco==3.1.6",
  "matplotlib>=3.3.4",
  "imageio >=2.14.1",
  "tqdm",
  "numba",
  "numpy",
  "scipy>=1.7.0",
  "opencv-python",
  "pin",
  "pyspacemouse",
]
dynamic = ["version"]

[project.optional-dependencies]
sarnn = [
  "torch",
  "torchvision",
  "scikit-learn>=1.3.0",
  "tensorboard",
  "torchinfo",
  "gdown",
  "imageio-ffmpeg",
]
act = [
  "torch",
  "torchvision",
  "pyyaml",
  "packaging",
  "h5py",
  "pyquaternion",
]
diffusion-policy = [
  "torch",
  "torchvision",
  "cffi",
  "zarr>=2.12.0",
  "numcodecs",
  "h5py",
  "hydra-core",
  "einops",
  "dill",
  "scikit-video>=1.1.11",
  "scikit-image>=0.19.3",
  "pymunk",
  "wandb",
  "threadpoolctl",
  "cython",
  "imageio-ffmpeg",
  "termcolor",
  "tensorboard>=2.10.1",
  "tensorboardx>=2.5.1",
  "psutil",
  "click",
  "pandas",
  "diffusers==0.11.1",
  "robomimic==0.2.0",
  "huggingface_hub==0.21.4",
  "urllib3<2",
]
real-ur5e = [
  "ur_rtde",
  "pyrealsense2",
]
real-xarm7 = [
  "xArm-Python-SDK",
  "pyrealsense2",
]
benchmarks = [
  "ruamel.yaml",
  "python-pptx",
  "imageio-ffmpeg",
  "ffmpeg-python",
]

[project.urls]
Fork = "https://github.com/hanebarla/SimBC-input-adaptive-leakage"
Issues = "https://github.com/hanebarla/SimBC-input-adaptive-leakage/issues"
Upstream = "https://github.com/isri-aist/RoboManipBaselines"
EIPL = "https://github.com/hanebarla/eipl"

[tool.setuptools.packages.find]
include = ["robo_manip_baselines", "robo_manip_baselines.*"]

[tool.setuptools.package-data]
robo_manip_baselines = ["envs/assets/**/*"]
